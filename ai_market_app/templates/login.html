<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background: #080c14; margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .bg-grid {
            background-image:
                linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow {
            box-shadow: 0 0 60px rgba(99,102,241,0.15), 0 0 120px rgba(99,102,241,0.06);
        }

        .input-field {
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .input-field::placeholder { color: #4b5563; }

        .btn-login {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
            font-weight: 600;
            padding: 13px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            letter-spacing: 0.025em;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-login:hover   { opacity: 0.92; }
        .btn-login:active  { transform: scale(0.98); }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        .float { animation: float 4s ease-in-out infinite; }

        @keyframes fadeIn {
            from { opacity:0; transform: translateY(16px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="min-h-screen bg-grid flex items-center justify-center p-4">

    <!-- Ambient blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full opacity-20"
             style="background:radial-gradient(circle,#6366f1,transparent 70%)"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full opacity-10"
             style="background:radial-gradient(circle,#818cf8,transparent 70%)"></div>
    </div>

    <div class="fade-in w-full max-w-sm">

        <!-- Logo -->
        <div class="text-center mb-8 float">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 glow"
                 style="background:linear-gradient(135deg,#4f46e5,#6366f1)">
                <svg class="w-9 h-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Yara</h1>
            <p class="text-sm text-gray-500 mt-1 mono">AI Stock Signal Dashboard</p>
        </div>

        <!-- Card -->
        <div class="rounded-2xl p-8"
             style="background:rgba(15,23,42,0.85);border:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px)">

            {% if error %}
            <div class="mb-5 flex items-center gap-2 rounded-xl px-4 py-3 text-sm text-red-300"
                 style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25)">
                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Username</label>
                    <input type="text" name="username" class="input-field mono"
                           placeholder="Enter username" autocomplete="username"
                           value="{{ username or '' }}" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="pwdField" class="input-field mono"
                               placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" onclick="togglePwd()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                            <svg id="eyeIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login mt-2">
                    Sign In to Yara
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-700 mt-6 mono">
            Personal use only &bull; Yara v1.0
        </p>
    </div>

    <script>
        function togglePwd() {
            const f = document.getElementById('pwdField');
            f.type = f.type === 'password' ? 'text' : 'password';
        }
        // Auto-focus username field
        document.querySelector('input[name="username"]').focus();
    </script>
</body>
</html>
